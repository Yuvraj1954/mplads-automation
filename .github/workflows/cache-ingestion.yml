name: Cache Ingestion

on:
  workflow_dispatch:
    inputs:
      snapshot_path:
        description: 'Path to snapshot directory on this machine (e.g. /path/to/2026-09-07T13-06-59Z)'
        required: true
        type: string

concurrency:
  group: mplads-cache-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r "${{ github.workspace }}/repo/requirements.txt"

      # ===========================================================
      # VALIDATE: Check source snapshot has valid _COMPLETE.json
      # ===========================================================
      - name: Validate source snapshot
        working-directory: ${{ github.workspace }}/repo
        run: |
          SNAPSHOT_PATH="${{ inputs.snapshot_path }}"
          echo "Validating snapshot at: $SNAPSHOT_PATH"

          if [ ! -d "$SNAPSHOT_PATH" ]; then
            echo "FATAL: $SNAPSHOT_PATH is not a directory"
            exit 1
          fi

          if [ ! -f "$SNAPSHOT_PATH/_COMPLETE.json" ]; then
            echo "FATAL: _COMPLETE.json missing in $SNAPSHOT_PATH"
            exit 1
          fi

          python3 -c "
          import json, sys
          from pathlib import Path

          p = Path('$SNAPSHOT_PATH')
          data = json.loads((p / '_COMPLETE.json').read_text())

          if data.get('status') != 'complete':
              print(f'FATAL: _COMPLETE.json status is \"{data.get(\"status\")}\", expected \"complete\"')
              sys.exit(1)

          datasets = data.get('datasets', {})
          print(f'_COMPLETE.json valid: status=complete, datasets={len(datasets)}')

          # Check part file counts match
          total_chunks = 0
          for ds_name, ds_info in datasets.items():
              expected = ds_info.get('chunks', 0)
              total_chunks += expected
              ds_dir = p / ds_name
              if not ds_dir.is_dir():
                  print(f'FATAL: Dataset directory missing: {ds_name}')
                  sys.exit(1)
              actual = len(list(ds_dir.glob('part_*.ndjson')))
              if actual < expected:
                  print(f'FATAL: {ds_name} has {actual} parts, expected {expected}')
                  sys.exit(1)

          print(f'All {len(datasets)} datasets validated, {total_chunks} total chunks')
          "

      # ===========================================================
      # STAGE: Copy snapshot into cache directory structure
      # ===========================================================
      - name: Stage snapshot for cache
        run: |
          SNAPSHOT_PATH="${{ inputs.snapshot_path }}"
          CACHE_DIR="/tmp/mplads-work"
          TIMESTAMP=$(basename "$SNAPSHOT_PATH")

          echo "Staging snapshot: $TIMESTAMP"
          echo "Source: $SNAPSHOT_PATH"
          echo "Cache target: $CACHE_DIR/current/$TIMESTAMP"

          mkdir -p "$CACHE_DIR/current"
          cp -r "$SNAPSHOT_PATH" "$CACHE_DIR/current/$TIMESTAMP"

          # Write metadata
          echo "$TIMESTAMP" > "$CACHE_DIR/.new_timestamp"
          python3 -c "
          import json
          meta = {'previous_ts': 'none', 'current_ts': '$TIMESTAMP'}
          with open('$CACHE_DIR/.cache-metadata.json', 'w') as f:
              json.dump(meta, f, indent=2)
          print(f'Metadata written: {json.dumps(meta)}')
          "

          # Verify _COMPLETE.json is in the staged copy
          if [ ! -f "$CACHE_DIR/current/$TIMESTAMP/_COMPLETE.json" ]; then
            echo "FATAL: _COMPLETE.json missing in staged copy"
            exit 1
          fi
          echo "Staged: $CACHE_DIR/current/$TIMESTAMP"
          echo "_COMPLETE.json verified in staged copy"

      # ===========================================================
      # SAVE: Upload to GitHub Actions cache
        #
        # Key: mplads-snapshot-state-<timestamp>
        # Immutable — cannot overwrite existing entry with same key.
        # If this key already exists, the save is a no-op (not an error).
        # The restore uses prefix match, so it will find this entry.
      # ===========================================================
      - name: Save to GitHub Actions cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/mplads-work
          key: mplads-snapshot-state-${{ inputs.snapshot_path | basename }}

      # ===========================================================
      # VERIFY: Read back and confirm cache entry exists
      # ===========================================================
      - name: Verify cache was saved
        run: |
          echo "Cache save completed."
          echo ""
          echo "Cache key: mplads-snapshot-state-${{ inputs.snapshot_path | basename }}"
          echo ""
          echo "To verify from a fresh workflow run:"
          echo "  1. Trigger the daily pipeline workflow"
          echo "  2. Check 'Restore snapshot cache (attempt 1)' step output"
          echo "  3. It should show 'Cache valid: previous=..., current=${{ inputs.snapshot_path | basename }}'"
          echo ""
          echo "The daily pipeline will now find this cache entry via prefix match"
          echo "on 'mplads-snapshot-state-' and use it as the previous snapshot."
