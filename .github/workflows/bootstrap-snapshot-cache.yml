name: Bootstrap Snapshot Cache

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag containing snapshot tarballs'
        required: true

concurrency:
  group: mplads-snapshot-cache
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # -----------------------------------------------------------
      # DOWNLOAD: Snapshot tarballs from draft GitHub Release
      # -----------------------------------------------------------
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading snapshots from release: ${{ inputs.release_tag }}"
          mkdir -p /tmp/bootstrap

          # Resolve the release by tag via API (works for draft releases)
          RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases/tags/${{ inputs.release_tag }}" 2>&1) || {
            echo "ERROR: Release '${{ inputs.release_tag }}' not found"
            echo "$RELEASE_JSON"
            exit 1
          }

          RELEASE_ID=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Release ID: $RELEASE_ID"

          # List assets and download snapshot-*.tar.gz via browser_download_url
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            --paginate \
            --jq '.[] | select(.name | startswith("snapshot-") and endswith(".tar.gz")) | [.name, .browser_download_url] | @tsv' \
            | while IFS=$'\t' read -r ASSET_NAME DOWNLOAD_URL; do
              echo "Downloading: $ASSET_NAME"
              curl -sSfL \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                "$DOWNLOAD_URL" \
                -o "/tmp/bootstrap/$ASSET_NAME" \
                || { echo "ERROR: Failed to download $ASSET_NAME"; exit 1; }
            done

          ASSET_COUNT=$(ls /tmp/bootstrap/snapshot-*.tar.gz 2>/dev/null | wc -l)
          if [ "$ASSET_COUNT" -lt 2 ]; then
            echo "ERROR: Expected at least 2 snapshot-*.tar.gz assets, found $ASSET_COUNT"
            exit 1
          fi

          echo "Downloaded files:"
          ls -la /tmp/bootstrap/

      # -----------------------------------------------------------
      # EXTRACT: Unpack tarballs
      # -----------------------------------------------------------
      - name: Extract snapshot tarballs
        run: |
          mkdir -p /tmp/mplads-work/previous
          mkdir -p /tmp/mplads-work/current

          # Count tarballs
          TARBALL_COUNT=$(ls /tmp/bootstrap/snapshot-*.tar.gz 2>/dev/null | wc -l)
          echo "Found $TARBALL_COUNT snapshot tarballs"

          if [ "$TARBALL_COUNT" -lt 2 ]; then
            echo "ERROR: Need at least 2 snapshot tarballs for bootstrap"
            exit 1
          fi

          # Extract all tarballs to a staging area
          STAGING=$(mktemp -d)
          for tarball in /tmp/bootstrap/snapshot-*.tar.gz; do
            echo "Extracting: $tarball"
            tar xzf "$tarball" -C "$STAGING"
          done

          # Find extracted snapshot directories
          SNAPSHOTS=$(find "$STAGING" -mindepth 1 -maxdepth 1 -type d)
          echo "Extracted snapshots:"
          echo "$SNAPSHOTS"

          # Identify timestamps and sort
          TIMESTAMP_1=$(basename $(echo "$SNAPSHOTS" | head -1))
          TIMESTAMP_2=$(basename $(echo "$SNAPSHOTS" | tail -1))

          # Ensure we have the correct order (older = previous, newer = current)
          if [[ "$TIMESTAMP_1" < "$TIMESTAMP_2" ]]; then
            PREVIOUS_TS="$TIMESTAMP_1"
            CURRENT_TS="$TIMESTAMP_2"
          else
            PREVIOUS_TS="$TIMESTAMP_2"
            CURRENT_TS="$TIMESTAMP_1"
          fi

          echo "Previous (older): $PREVIOUS_TS"
          echo "Current (newer):  $CURRENT_TS"

          # Copy to final locations
          cp -r "$STAGING/$PREVIOUS_TS" /tmp/mplads-work/previous/
          cp -r "$STAGING/$CURRENT_TS" /tmp/mplads-work/current/

          # Write metadata
          cat > /tmp/mplads-work/.cache-metadata.json << 'METAEOF'
          {
            "previous_ts": "PLACEHOLDER",
            "current_ts": "PLACEHOLDER",
            "created_at": "PLACEHOLDER",
            "bootstrap": true
          }
          METAEOF

          # Rebuild metadata properly to avoid heredoc interpolation issues
          python3 -c "
          import json
          from datetime import datetime, timezone
          meta = {
              'previous_ts': '$PREVIOUS_TS',
              'current_ts': '$CURRENT_TS',
              'created_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'bootstrap': True
          }
          with open('/tmp/mplads-work/.cache-metadata.json', 'w') as f:
              json.dump(meta, f, indent=2)
              f.write('\n')
          "

          echo "Metadata:"
          cat /tmp/mplads-work/.cache-metadata.json

          # Cleanup staging
          rm -rf "$STAGING"

      # -----------------------------------------------------------
      # VALIDATE: Check both snapshots are complete
      # -----------------------------------------------------------
      - name: Validate snapshots
        id: validate
        run: |
          python3 -c "
          import json, os, sys
          from pathlib import Path

          work = Path('/tmp/mplads-work')
          metadata = json.loads((work / '.cache-metadata.json').read_text())

          errors = []
          for role in ['previous', 'current']:
              ts = metadata[f'{role}_ts']
              snap_dir = work / role / ts
              print(f'Validating {role}: {snap_dir}')

              if not snap_dir.exists():
                  errors.append(f'{role}: directory missing')
                  continue

              complete = snap_dir / '_COMPLETE.json'
              if not complete.exists():
                  errors.append(f'{role}: _COMPLETE.json missing')
                  continue

              marker = json.loads(complete.read_text())
              if marker.get('status') != 'complete':
                  errors.append(f'{role}: status is {marker.get(\"status\")!r}')

              # Check for part files
              has_parts = False
              for dataset_dir in snap_dir.iterdir():
                  if dataset_dir.is_dir():
                      parts = list(dataset_dir.glob('part_*.ndjson'))
                      if parts:
                          has_parts = True
                          break

              if not has_parts:
                  errors.append(f'{role}: no part_*.ndjson files found')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)

          print('Both snapshots validated successfully')
          print(f'Previous: {metadata["previous_ts"]}')
          print(f'Current:  {metadata["current_ts"]}')

          # Export current_ts as step output
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'current_ts={metadata["current_ts"]}\n')
          "

      # -----------------------------------------------------------
      # SAVE: Create initial cache state
      # -----------------------------------------------------------
      - name: Save bootstrap cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/mplads-work
          key: mplads-snapshot-state-${{ steps.validate.outputs.current_ts }}

      # -----------------------------------------------------------
      # VERIFY: Confirm cache was created
      # -----------------------------------------------------------
      - name: Verify cache exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying cache entries..."
          gh cache list --key mplads-snapshot-state- --json key,createdAt --limit 5

      # -----------------------------------------------------------
      # REPORT: Success summary
      # -----------------------------------------------------------
      - name: Report success
        run: |
          echo "========================================="
          echo "BOOTSTRAP COMPLETE"
          echo "========================================="
          echo ""
          echo "Initial rolling snapshot state created:"
          cat /tmp/mplads-work/.cache-metadata.json
          echo ""
          echo "Next step: Run the daily pipeline."
          echo "The pipeline will use GitHub cache for the previous snapshot."
          echo ""
          echo "You can now delete the draft release '${{ inputs.release_tag }}'."
