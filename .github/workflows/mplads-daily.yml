name: MPLADS Daily Pipeline

on:
  workflow_dispatch:
    inputs:
      sync_interval_hours:
        description: 'Sync interval in hours (default: 24)'
        required: false
        default: '24'
      bootstrap:
        description: 'One-time NEW DB bootstrap from cached snapshot (default: false)'
        required: false
        type: boolean
        default: false

  schedule:
    # 18:30 UTC = 00:00 IST (midnight Indian Standard Time)
    - cron: "30 18 * * *"

concurrency:
  group: mplads-daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r "${{ github.workspace }}/repo/requirements.txt"

      # ===========================================================
      # RESTORE FAILURE STATE: Persistent counter across runners
      # Stored in GitHub Actions cache (separate from snapshot cache).
      # First run: defaults to 0. Survives runner restarts.
      # ===========================================================
      - name: Restore failure state from cache
        uses: actions/cache/restore@v4
        id: failure-state-restore
        with:
          path: /tmp/mplads-failure-state
          key: mplads-failure-state-${{ github.run_id }}
          restore-keys: mplads-failure-state-

      - name: Read failure state
        id: failure-state
        run: |
          STATE_FILE="/tmp/mplads-failure-state/failure_state.json"
          if [ -f "$STATE_FILE" ]; then
            FAILURES=$(python3 -c "import json; print(json.load(open('$STATE_FILE')).get('consecutive_failures', 0))")
            echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
            echo "Consecutive failures restored: $FAILURES"
          else
            echo "failures=0" >> "$GITHUB_OUTPUT"
            echo "No failure state found — defaulting to 0"
          fi

      # ===========================================================
      # CACHE RESTORE: Attempt 1
      # ===========================================================
      - name: Restore snapshot cache (attempt 1)
        uses: actions/cache/restore@v4
        id: cache-restore-1
        with:
          path: /tmp/mplads-work
          key: mplads-snapshot-state-${{ github.run_id }}
          restore-keys: |
            mplads-snapshot-state-

      - name: Validate cache (attempt 1)
        id: validate-1
        working-directory: ${{ github.workspace }}/repo
        run: |
          python3 -c "
          import sys, json
          sys.path.insert(0, '.')
          from automation.snapshot_cache import validate_cache, get_previous_timestamp, get_current_timestamp
          from pathlib import Path

          work_dir = Path('/tmp/mplads-work')
          if not work_dir.exists():
              print('Cache not restored (transient failure — retry may help)')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('cache_valid=false\n')
                  f.write('cache_restored=false\n')
              sys.exit(0)

          ok, err = validate_cache(work_dir)
          if ok:
              prev_ts = get_previous_timestamp(work_dir)
              curr_ts = get_current_timestamp(work_dir)
              print(f'Cache valid: previous={prev_ts}, current={curr_ts}')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('cache_valid=true\n')
                  f.write('cache_restored=true\n')
          else:
              print(f'Cache restored but INVALID (deterministic — retry is pointless): {err}')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('cache_valid=false\n')
                  f.write('cache_restored=true\n')
          "

      # ===========================================================
      # CACHE RESTORE: Attempt 2 (only if attempt 1 transient-failed)
      #
      # Only retry if the cache was NOT restored (transient failure).
      # If the cache was restored but validation failed (deterministic),
      # retrying the same immutable cache is pointless.
      # ===========================================================
      - name: Clear invalid cache for retry
        if: steps.validate-1.outputs.cache_valid != 'true' && steps.validate-1.outputs.cache_restored != 'true' && github.event.inputs.bootstrap != 'true'
        run: rm -rf /tmp/mplads-work

      - name: Restore snapshot cache (attempt 2)
        if: steps.validate-1.outputs.cache_valid != 'true' && steps.validate-1.outputs.cache_restored != 'true' && github.event.inputs.bootstrap != 'true'
        uses: actions/cache/restore@v4
        id: cache-restore-2
        with:
          path: /tmp/mplads-work
          key: mplads-snapshot-state-${{ github.run_id }}
          restore-keys: |
            mplads-snapshot-state-

      - name: Validate cache (attempt 2)
        if: steps.validate-1.outputs.cache_valid != 'true' && steps.validate-1.outputs.cache_restored != 'true' && github.event.inputs.bootstrap != 'true'
        id: validate-2
        working-directory: ${{ github.workspace }}/repo
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from automation.snapshot_cache import validate_cache, get_previous_timestamp, get_current_timestamp
          from pathlib import Path

          work_dir = Path('/tmp/mplads-work')
          if not work_dir.exists():
              print('Cache still missing after retry')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('cache_valid=false\n')
                  f.write('cache_restored=false\n')
              sys.exit(0)

          ok, err = validate_cache(work_dir)
          if ok:
              prev_ts = get_previous_timestamp(work_dir)
              curr_ts = get_current_timestamp(work_dir)
              print(f'Cache valid on retry: previous={prev_ts}, current={curr_ts}')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('cache_valid=true\n')
                  f.write('cache_restored=true\n')
          else:
              print(f'Cache restored but INVALID (deterministic): {err}')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('cache_valid=false\n')
                  f.write('cache_restored=true\n')
          "

      # ===========================================================
      # CACHE RESTORE: Attempt 3 (only if attempts 1-2 transient-failed)
      # ===========================================================
      - name: Clear invalid cache for retry 2
        if: steps.validate-1.outputs.cache_valid != 'true' && steps.validate-1.outputs.cache_restored != 'true' && steps.validate-2.outputs.cache_valid != 'true' && steps.validate-2.outputs.cache_restored != 'true' && github.event.inputs.bootstrap != 'true'
        run: rm -rf /tmp/mplads-work

      - name: Restore snapshot cache (attempt 3)
        if: steps.validate-1.outputs.cache_valid != 'true' && steps.validate-1.outputs.cache_restored != 'true' && steps.validate-2.outputs.cache_valid != 'true' && steps.validate-2.outputs.cache_restored != 'true' && github.event.inputs.bootstrap != 'true'
        uses: actions/cache/restore@v4
        id: cache-restore-3
        with:
          path: /tmp/mplads-work
          key: mplads-snapshot-state-${{ github.run_id }}
          restore-keys: |
            mplads-snapshot-state-

      - name: Validate cache (attempt 3)
        if: steps.validate-1.outputs.cache_valid != 'true' && steps.validate-1.outputs.cache_restored != 'true' && steps.validate-2.outputs.cache_valid != 'true' && steps.validate-2.outputs.cache_restored != 'true' && github.event.inputs.bootstrap != 'true'
        id: validate-3
        working-directory: ${{ github.workspace }}/repo
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from automation.snapshot_cache import validate_cache, get_previous_timestamp, get_current_timestamp
          from pathlib import Path

          work_dir = Path('/tmp/mplads-work')
          if not work_dir.exists():
              print('Cache still missing after retry 2')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('cache_valid=false\n')
                  f.write('cache_restored=false\n')
              sys.exit(0)

          ok, err = validate_cache(work_dir)
          if ok:
              prev_ts = get_previous_timestamp(work_dir)
              curr_ts = get_current_timestamp(work_dir)
              print(f'Cache valid on retry 2: previous={prev_ts}, current={curr_ts}')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('cache_valid=true\n')
                  f.write('cache_restored=true\n')
          else:
              print(f'Cache restored but INVALID (deterministic): {err}')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('cache_valid=false\n')
                  f.write('cache_restored=true\n')
          "

      # ===========================================================
      # VALIDATE BOOTSTRAP CACHE: Check if current snapshot is usable
      # ===========================================================
      - name: Validate bootstrap cache
        if: github.event.inputs.bootstrap == 'true'
        id: bootstrap-validate
        working-directory: ${{ github.workspace }}/repo
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from automation.snapshot_cache import validate_bootstrap_cache
          from pathlib import Path

          work_dir = Path('/tmp/mplads-work')
          ok, err = validate_bootstrap_cache(work_dir)
          if ok:
              print('Bootstrap cache valid')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('bootstrap_cache_valid=true\n')
          else:
              print(f'Bootstrap cache invalid: {err}')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('bootstrap_cache_valid=false\n')
          "

      # ===========================================================
      # SET FALLBACK FLAG: Emergency after 3 consecutive failures
      #
      # State machine (consecutive_failures = completed runs that failed):
      #   start 0 → FAIL → 1    (no fallback)
      #   start 1 → FAIL → 2    (no fallback)
      #   start 2 → FAIL → 3    (no fallback)
      #   start 3 → EMERGENCY   (Supabase recovery attempt)
      #     if succeeds → 0
      #     if fails    → 4 (still eligible for emergency)
      #   Any start >= 3 → EMERGENCY (until a success resets to 0)
      #
      # The counter reflects PREVIOUS run outcomes, read from
      # persistent GitHub Actions cache restored at job start.
      # ===========================================================
      - name: Determine fallback strategy
        id: strategy
        run: |
          if [ "${{ github.event.inputs.bootstrap }}" == "true" ]; then
            BOOTSTRAP_CACHE="${{ steps.bootstrap-validate.outputs.bootstrap_cache_valid }}"
            if [ "$BOOTSTRAP_CACHE" == "true" ]; then
              echo "Bootstrap cache valid — bootstrap path"
              echo "bootstrap_mode=true" >> "$GITHUB_OUTPUT"
            else
              echo "Bootstrap cache invalid — falling back to full pipeline"
              echo "bootstrap_mode=false" >> "$GITHUB_OUTPUT"
            fi
            echo "use_supabase_fallback=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VALID_1="${{ steps.validate-1.outputs.cache_valid }}"
          VALID_2="${{ steps.validate-2.outputs.cache_valid }}"
          VALID_3="${{ steps.validate-3.outputs.cache_valid }}"
          FAILURES="${{ steps.failure-state.outputs.failures }}"

          if [ "$VALID_1" == "true" ] || [ "$VALID_2" == "true" ] || [ "$VALID_3" == "true" ]; then
            echo "Cache available — normal path"
            echo "use_supabase_fallback=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cache unavailable after 3 retries."
            echo "Failure count: $FAILURES"
            if [ "$FAILURES" -ge 3 ] 2>/dev/null; then
              echo "EMERGENCY: $FAILURES consecutive failures — enabling Supabase fallback"
              echo "use_supabase_fallback=true" >> "$GITHUB_OUTPUT"
            else
              echo "Supabase fallback requires >= 3 consecutive failures."
              echo "Failing safely — pipeline will retry on next scheduled run."
              echo "use_supabase_fallback=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # ===========================================================
      # GATE: Fail workflow if no valid previous snapshot available
      #
      # This runs BEFORE the pipeline. If all 3 cache validations
      # failed and Supabase fallback is not enabled, there is no
      # valid previous snapshot. The pipeline CANNOT safely continue
      # in affected comparison mode.
      #
      # Without this gate, the pipeline would start, fail in STEP 2,
      # and the workflow would still show SUCCESS because the final
      # `if: always()` steps succeed.
      # ===========================================================
      - name: Gate — verify previous snapshot available
        if: github.event.inputs.bootstrap != 'true' && steps.strategy.outputs.use_supabase_fallback != 'true'
        working-directory: ${{ github.workspace }}/repo
        run: |
          VALID_1="${{ steps.validate-1.outputs.cache_valid }}"
          VALID_2="${{ steps.validate-2.outputs.cache_valid }}"
          VALID_3="${{ steps.validate-3.outputs.cache_valid }}"

          if [ "$VALID_1" == "true" ] || [ "$VALID_2" == "true" ] || [ "$VALID_3" == "true" ]; then
            echo "Cache available — proceeding"
            exit 0
          fi

          echo "FATAL: No valid previous trusted snapshot available."
          echo ""
          # Determine failure type for diagnostics
          R1="${{ steps.validate-1.outputs.cache_restored }}"
          R2="${{ steps.validate-2.outputs.cache_restored }}"
          R3="${{ steps.validate-3.outputs.cache_restored }}"
          if [ "$R1" == "true" ] || [ "$R2" == "true" ] || [ "$R3" == "true" ]; then
            echo "Cache was RESTORED but validation FAILED (deterministic — _COMPLETE.json missing/corrupt)."
            echo "Retrying the same immutable cache would not help."
          else
            echo "Cache was NOT RESTORED (transient — network/infra failure)."
          fi
          echo ""
          echo "Bootstrap is disabled."
          echo "Pipeline cannot safely continue in affected mode."
          echo ""
          echo "To fix:"
          echo "  1. Run: python3 automation/seed_cache.py /path/to/snapshot_dir"
          echo "  2. Or trigger this workflow with bootstrap=true after cache is populated."
          exit 1

      # ===========================================================
      # RUN PIPELINE
      # ===========================================================
      - name: Run complete MPLADS pipeline
        if: ${{ github.event.inputs.bootstrap != 'true' || steps.strategy.outputs.bootstrap_mode == 'false' }}
        working-directory: ${{ github.workspace }}/repo
        env:
          PYTHONUNBUFFERED: 1
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB2_URL: ${{ secrets.DB2_URL }}
          DB2_SERVICE_ROLE_KEY: ${{ secrets.DB2_SERVICE_ROLE_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODELS: "gemini-3.1-flash-lite,gemini-3.5-flash-lite"
          GEMINI_CONCURRENCY: "12"
          GEMINI_ITEMS_PER_REQUEST: "5"
          FETCH_CONCURRENCY: "5"
          INGEST_CONCURRENCY: "5"
          SYNC_INTERVAL_HOURS: ${{ github.event.inputs.sync_interval_hours || '24' }}
          MPLADS_CACHE_WORK_DIR: /tmp/mplads-work
          USE_SUPABASE_FALLBACK: ${{ steps.strategy.outputs.use_supabase_fallback }}
        run: python automation/daily_pipeline.py

      - name: Run bootstrap (one-time NEW DB initialization)
        if: ${{ github.event.inputs.bootstrap == 'true' && steps.strategy.outputs.bootstrap_mode == 'true' }}
        working-directory: ${{ github.workspace }}/repo
        env:
          PYTHONUNBUFFERED: 1
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB2_URL: ${{ secrets.DB2_URL }}
          DB2_SERVICE_ROLE_KEY: ${{ secrets.DB2_SERVICE_ROLE_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODELS: "gemini-3.1-flash-lite,gemini-3.5-flash-lite"
          GEMINI_CONCURRENCY: "12"
          GEMINI_ITEMS_PER_REQUEST: "5"
          FETCH_CONCURRENCY: "5"
          INGEST_CONCURRENCY: "5"
          MPLADS_CACHE_WORK_DIR: /tmp/mplads-work
        run: python automation/daily_pipeline.py --bootstrap

      # ===========================================================
      # FAILED RUN CLEANUP: Delete failed snapshot from Supabase
      # Runs only when the pipeline step fails.
      # Idempotent: if Python already cleaned up, this safely finds
      # nothing and continues. If Python cleanup failed, this retries.
      # ===========================================================
      - name: Cleanup failed snapshot from Supabase
        if: failure() && (github.event.inputs.bootstrap != 'true' || steps.strategy.outputs.bootstrap_mode == 'false')
        working-directory: ${{ github.workspace }}/repo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          SNAPSHOT_TS_FILE="/tmp/mplads-work/.current_snapshot_ts"
          if [ -f "$SNAPSHOT_TS_FILE" ]; then
            FAILED_TS=$(cat "$SNAPSHOT_TS_FILE")
            echo "Cleaning up failed snapshot from Supabase: $FAILED_TS"
            python automation/_cleanup_failed_snapshot.py "$FAILED_TS"
          else
            echo "No snapshot timestamp found — nothing to clean up"
          fi

      # ===========================================================
      # READ NEW TIMESTAMP: Pipeline wrote .new_timestamp on success
      # ===========================================================
      - name: Read new snapshot timestamp
        if: success() && (github.event.inputs.bootstrap != 'true' || steps.strategy.outputs.bootstrap_mode == 'false')
        id: new-ts
        run: |
          NEW_TS_FILE="/tmp/mplads-work/.new_timestamp"
          if [ -f "$NEW_TS_FILE" ]; then
            NEW_TS=$(cat "$NEW_TS_FILE")
            echo "new_ts=$NEW_TS" >> "$GITHUB_OUTPUT"
            echo "New snapshot timestamp: $NEW_TS"
          else
            echo "No .new_timestamp found — pipeline may have failed or had no changes"
            echo "new_ts=" >> "$GITHUB_OUTPUT"
          fi

      # ===========================================================
      # ROTATE: On success — move current → previous
      # ===========================================================
      - name: Rotate snapshots
        if: success() && steps.new-ts.outputs.new_ts != '' && (github.event.inputs.bootstrap != 'true' || steps.strategy.outputs.bootstrap_mode == 'false')
        working-directory: ${{ github.workspace }}/repo
        env:
          MPLADS_CACHE_WORK_DIR: /tmp/mplads-work
        run: |
          python3 -c "
          import sys, shutil
          sys.path.insert(0, '.')
          from automation.snapshot_cache import (
              get_previous_timestamp, get_current_timestamp,
              write_metadata
          )
          from pathlib import Path

          work_dir = Path('/tmp/mplads-work')
          prev_dir = work_dir / 'previous'
          curr_dir = work_dir / 'current'

          # Find ALL current snapshot directories
          curr_snapshots = sorted([
              d.name for d in curr_dir.iterdir()
              if d.is_dir() and not d.name.startswith('.')
          ]) if curr_dir.exists() else []

          if len(curr_snapshots) < 2:
              # First run or no previous current — no rotation needed
              print(f'Only {len(curr_snapshots)} current snapshot(s) — skipping rotation')
              # Update metadata with what we have
              old_prev = get_previous_timestamp(work_dir)
              new_curr = curr_snapshots[-1] if curr_snapshots else None
              write_metadata(old_prev or 'none', new_curr, work_dir)
              print(f'Metadata: previous={old_prev or \"none\"}, current={new_curr}')
              sys.exit(0)

          # Normal rotation: move oldest current → previous
          old_curr_ts = curr_snapshots[0]
          new_curr_ts = curr_snapshots[-1]

          if prev_dir.exists():
              shutil.rmtree(prev_dir)

          prev_dir.mkdir(parents=True, exist_ok=True)
          shutil.move(str(curr_dir / old_curr_ts), str(prev_dir / old_curr_ts))
          print(f'Rotated: previous={old_curr_ts}, current={new_curr_ts}')

          write_metadata(old_curr_ts, new_curr_ts, work_dir)
          print(f'Metadata updated: previous={old_curr_ts}, current={new_curr_ts}')
          "

      # ===========================================================
      # SAVE SNAPSHOT CACHE: New immutable cache key using timestamp
      #
      # Cache write integrity:
      # - Candidate snapshot validated by validate_complete_snapshot()
      #   BEFORE rotation (in pipeline STEP 2)
      # - Immutable timestamped key: mplads-snapshot-state-<ts>
      # - Never overwrites trusted previous cache (new key each run)
      # - Failed run never reaches this step (only runs on success)
      # - Restored cache always validated before use (3 attempts)
      # - GitHub cache is immutable post-save; read-back verification
      #   is impractical (save happens post-job). Compensation:
      #   candidate fully validated before save, trusted previous
      #   never modified.
      # ===========================================================
      - name: Save snapshot cache
        if: success() && steps.new-ts.outputs.new_ts != '' && (github.event.inputs.bootstrap != 'true' || steps.strategy.outputs.bootstrap_mode == 'false')
        uses: actions/cache/save@v4
        with:
          path: /tmp/mplads-work
          key: mplads-snapshot-state-${{ steps.new-ts.outputs.new_ts }}

      # ===========================================================
      # CLEANUP: Best-effort old cache entries
      # ===========================================================
      - name: Cleanup old cache entries
        if: success() && (github.event.inputs.bootstrap != 'true' || steps.strategy.outputs.bootstrap_mode == 'false')
        continue-on-error: true
        run: |
          echo "Cache cleanup is best-effort — never blocks pipeline"
          echo "Old entries expire automatically per GitHub cache limits"

      # ===========================================================
      # UPDATE FAILURE STATE: Increment on failure, reset on success
      #
      # Runs ALWAYS (even on failure) to ensure the counter persists.
      # Uses save-always: true on the cache save step below.
      # ===========================================================
      - name: Update failure state
        if: always() && (github.event.inputs.bootstrap != 'true' || steps.strategy.outputs.bootstrap_mode == 'false')
        id: update-failure-state
        run: |
          mkdir -p /tmp/mplads-failure-state
          PREV_FAILURES="${{ steps.failure-state.outputs.failures }}"
          if [ -z "$PREV_FAILURES" ]; then PREV_FAILURES=0; fi

          if [ "${{ job.status }}" == "success" ]; then
            echo '{"consecutive_failures": 0, "last_updated": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' \
              > /tmp/mplads-failure-state/failure_state.json
            echo "Pipeline succeeded — counter reset to 0"
            echo "new_failures=0" >> "$GITHUB_OUTPUT"
          else
            NEW_COUNT=$((PREV_FAILURES + 1))
            echo '{"consecutive_failures": '$NEW_COUNT', "last_updated": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' \
              > /tmp/mplads-failure-state/failure_state.json
            echo "Pipeline failed — counter incremented: $PREV_FAILURES → $NEW_COUNT"
            echo "new_failures=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          fi

      # ===========================================================
      # SAVE FAILURE STATE: Persists across runners via cache
      #
      # Uses per-run key (mplads-failure-state-<run_id>) to avoid
      # race conditions when concurrent runs try to save.
      # Restore uses prefix match to find the latest entry.
      #
      # NOTE: save-always is NOT supported by actions/cache/save@v4.
      # This step runs inside an if: always() block so it executes
      # even when the pipeline fails. The cache save itself only
      # succeeds on the first attempt per key (GitHub semantics),
      # but since each run has a unique key, this always works.
      # ===========================================================
      - name: Save failure state to cache
        if: always() && (github.event.inputs.bootstrap != 'true' || steps.strategy.outputs.bootstrap_mode == 'false')
        uses: actions/cache/save@v4
        with:
          path: /tmp/mplads-failure-state
          key: mplads-failure-state-${{ github.run_id }}
