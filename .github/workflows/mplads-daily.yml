name: MPLADS Daily Pipeline

on:
  workflow_dispatch:
    inputs:
      sync_interval_hours:
        description: 'Sync interval in hours (default: 24)'
        required: false
        default: '24'

  schedule:
    # 00:00 UTC = 05:30 IST
    - cron: "0 0 * * *"

concurrency:
  group: mplads-daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run complete MPLADS pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_INTERVAL_HOURS: ${{ github.event.inputs.sync_interval_hours || '24' }}
        run: python automation/daily_pipeline.py
