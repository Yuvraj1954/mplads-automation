name: Cleanup Workflow History

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: Remove obsolete workflow runs
    runs-on: ubuntu-latest

    steps:
      - name: Delete obsolete workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " GitHub Actions History Cleanup"
          echo "=========================================="
          echo
          echo "Protected workflows:"
          echo "  - MPLADS Daily Pipeline"
          echo "  - Dependency Graph"
          echo "  - Current Cleanup Workflow"
          echo

          deleted=0
          kept=0

          gh run list \
            --repo "$REPO" \
            --limit 1000 \
            --json databaseId,workflowName,status,conclusion,createdAt \
            > /tmp/runs.json

          echo "Scanning workflow runs..."
          echo

          while IFS= read -r run; do

            RUN_ID=$(echo "$run" | jq -r '.databaseId')
            WORKFLOW=$(echo "$run" | jq -r '.workflowName')
            STATUS=$(echo "$run" | jq -r '.status')
            CONCLUSION=$(echo "$run" | jq -r '.conclusion // "null"')
            CREATED=$(echo "$run" | jq -r '.createdAt')

            # Keep the two production workflows.
            if [[ "$WORKFLOW" == "MPLADS Daily Pipeline" ]] ||
               [[ "$WORKFLOW" == "Dependency Graph" ]]; then

              echo "KEEP   | $WORKFLOW | run $RUN_ID | $CONCLUSION | $CREATED"
              kept=$((kept + 1))
              continue
            fi

            # Never delete the currently running cleanup workflow.
            if [[ "$RUN_ID" == "$CURRENT_RUN_ID" ]]; then
              echo "KEEP   | Current cleanup run | run $RUN_ID"
              kept=$((kept + 1))
              continue
            fi

            echo "DELETE | $WORKFLOW | run $RUN_ID | $CONCLUSION | $CREATED"

            gh api \
              --method DELETE \
              "/repos/$REPO/actions/runs/$RUN_ID"

            deleted=$((deleted + 1))

          done < <(jq -c '.[]' /tmp/runs.json)

          echo
          echo "=========================================="
          echo " Cleanup Complete"
          echo "=========================================="
          echo "Deleted runs : $deleted"
          echo "Kept runs    : $kept"
          echo "=========================================="

      - name: Verify remaining workflow history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo " Remaining Workflow History"
          echo "=========================================="

          gh run list \
            --repo "$REPO" \
            --limit 1000 \
            --json databaseId,workflowName,status,conclusion,createdAt |
          jq -r '
            .[]
            | [
                .databaseId,
                .workflowName,
                (.conclusion // "null"),
                .createdAt
              ]
            | @tsv
          '

          echo
          echo "Checking for obsolete runs..."

          REMAINING=$(gh run list \
            --repo "$REPO" \
            --limit 1000 \
            --json databaseId,workflowName |
            jq '
              [
                .[]
                | select(
                    .workflowName != "MPLADS Daily Pipeline"
                    and .workflowName != "Dependency Graph"
                    and .workflowName != "Cleanup Workflow History"
                  )
              ]
              | length
            ')

          echo "Obsolete runs remaining: $REMAINING"

          if [[ "$REMAINING" -ne 0 ]]; then
            echo "ERROR: Obsolete workflow runs remain."
            exit 1
          fi

          echo
          echo "SUCCESS"
          echo "Only protected workflow history remains."
          
