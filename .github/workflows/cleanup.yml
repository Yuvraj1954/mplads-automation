name: Cleanup Failed Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete non-successful MPLADS runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          WORKFLOW="mplads-daily.yml"

          gh run list \
            --repo "$REPO" \
            --workflow "$WORKFLOW" \
            --limit 100 \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion != "success" and .conclusion != null) | .databaseId' |
          while read RUN_ID; do
            echo "Deleting failed/non-success run: $RUN_ID"
            gh run delete "$RUN_ID" --repo "$REPO"
          done
          
