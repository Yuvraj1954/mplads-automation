name: Cleanup Workflow History

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: Remove obsolete workflow runs
    runs-on: ubuntu-latest

    steps:
      - name: Delete all runs except protected workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " GitHub Actions History Cleanup"
          echo "=========================================="
          echo
          echo "Protected workflows:"
          echo "  - MPLADS Daily Pipeline"
          echo "  - Dependency Graph"
          echo

          deleted=0
          kept=0

          gh run list \
            --repo "$REPO" \
            --limit 1000 \
            --json databaseId,workflowName,status,conclusion,createdAt \
            > /tmp/runs.json

          echo "Scanning workflow runs..."
          echo

          while IFS= read -r run; do
            RUN_ID=$(echo "$run" | jq -r '.databaseId')
            WORKFLOW=$(echo "$run" | jq -r '.workflowName')
            STATUS=$(echo "$run" | jq -r '.status')
            CONCLUSION=$(echo "$run" | jq -r '.conclusion // "null"')
            CREATED=$(echo "$run" | jq -r '.createdAt')

            if [[ "$WORKFLOW" == "MPLADS Daily Pipeline" ]] ||
               [[ "$WORKFLOW" == "Dependency Graph" ]]; then

              echo "KEEP   | $WORKFLOW | run $RUN_ID | $CONCLUSION | $CREATED"
              kept=$((kept + 1))

            else

              echo "DELETE | $WORKFLOW | run $RUN_ID | $CONCLUSION | $CREATED"

              gh run delete "$RUN_ID" \
                --repo "$REPO" \
                --confirm

              deleted=$((deleted + 1))
            fi

          done < <(jq -c '.[]' /tmp/runs.json)

          echo
          echo "=========================================="
          echo " Cleanup Complete"
          echo "=========================================="
          echo "Deleted runs : $deleted"
          echo "Kept runs    : $kept"
          echo "=========================================="

      - name: Verify cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo " Verifying remaining history"
          echo "=========================================="

          gh run list \
            --repo "$REPO" \
            --limit 1000 \
            --json databaseId,workflowName,status,conclusion,createdAt |
          jq -r '
            .[]
            | [
                .databaseId,
                .workflowName,
                (.conclusion // "null"),
                .createdAt
              ]
            | @tsv
          '

          REMAINING=$(gh run list \
            --repo "$REPO" \
            --limit 1000 \
            --json workflowName |
            jq '
              [
                .[]
                | select(
                    .workflowName != "MPLADS Daily Pipeline"
                    and .workflowName != "Dependency Graph"
                  )
              ]
              | length
            ')

          echo
          echo "Obsolete workflow runs remaining: $REMAINING"

          if [[ "$REMAINING" -ne 0 ]]; then
            echo "ERROR: Cleanup incomplete."
            exit 1
          fi

          echo
          echo "SUCCESS"
          echo "Only protected workflow history remains."
